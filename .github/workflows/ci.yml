name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify skill package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile all sources
        run: python -m compileall -q scripts tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate config examples
        run: |
          python scripts/validate_config.py config/examples/global.json
          python scripts/validate_config.py config/examples/host-github.json
          python scripts/validate_config.py config/examples/project.json

      - name: Scan for secrets
        run: |
          python - <<'EOF'
          import pathlib, re, sys
          patterns = {
              "OpenAI-like key": re.compile(r"sk-[A-Za-z0-9_-]{20,}"),
              "AWS access key": re.compile(r"AKIA[0-9A-Z]{16}"),
              "private key": re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"),
              "assigned credential": re.compile(
                  r"""(?i)(?:api[_-]?key|secret|password|token)\s*[:=]\s*["'][^"']{8,}["']"""
              ),
          }
          ignored = {".git", "__pycache__", "node_modules", "dist"}
          findings = []
          for path in pathlib.Path(".").rglob("*"):
              if not path.is_file() or path.suffix.lower() not in {".md", ".json", ".yaml", ".yml", ".py", ".js", ".ts", ".sh", ".toml"}:
                  continue
              if any(part in ignored for part in path.parts):
                  continue
              text = path.read_text(encoding="utf-8", errors="replace")
              for lineno, line in enumerate(text.splitlines(), 1):
                  for label, pattern in patterns.items():
                      if pattern.search(line):
                          findings.append(f"{path}:{lineno} [{label}]")
          if findings:
              print("Secret patterns found:")
              print("\n".join(findings))
              sys.exit(1)
          print("No secret patterns found")
          EOF

      - name: Verify README and manifest consistency
        run: |
          python - <<'EOF'
          import json
          m = json.load(open("manifest.json", encoding="utf-8"))
          assert m["name"] == "starline-git-submit"
          print(f"manifest ok: {m['name']} v{m['version']}")
          EOF
